name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write   # utile si tu publies un rapport SARIF plus tard

env:
  ACR_LOGIN_SERVER: acrauraweardev01.azurecr.io
  IMAGE_NAME: aura-wear

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker login to ACR
        run: az acr login --name acrauraweardev01

      - name: Build image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.meta.outputs.tag }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
            .

      # --- Security gate (SLA / vulnérabilités) ---
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.meta.outputs.tag }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest